map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: /map
    frame_id: map
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.25
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      width: 80
      height: 80
      origin_x: -40.0
      origin_y: -40.0
      rolling_window: false
      track_unknown_space: true
      footprint: '[[0.255000, 0.215000], [0.255000, -0.215000], [-0.255000, -0.215000],
        [-0.255000, 0.215000]]'
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap_client:
  ros__parameters:
    use_sim_time: false
global_costmap_rclcpp_node:
  ros__parameters:
    use_sim_time: false
