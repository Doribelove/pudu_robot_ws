# Copy to .github/workflows/trilayer-humble.yml in the independent repository.
# Prepared locally; no remote workflow has been enabled or executed.
name: TriLayer Humble source build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, trilayer-humble-source]
permissions:
  contents: read
concurrency:
  group: trilayer-humble-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  humble-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONNOUSERSITE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Set up official ROS Humble packages
        uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # 0.7.19
        with:
          required-ros-distributions: humble
          use-ros2-testing: false
          install-connext: false
      - name: Install manifest dependencies with explicit CI-only rosdep rules
        run: bash release/ci/install-deps.sh
      - name: Build solvers from source and build/test all independent packages
        run: bash release/ci/build-and-test.sh
      - name: Preserve build, source provenance and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: humble-amd64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci_ws/evidence/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
