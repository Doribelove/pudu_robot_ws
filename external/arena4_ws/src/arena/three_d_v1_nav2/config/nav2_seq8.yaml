map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 0.0
    planner_plugins: ["FrozenR1"]
    FrozenR1:
      plugin: "three_d_v1_nav2/FrozenR1PathPlanner"
      path_bank_index: "PATH_BANK_INDEX_REQUIRED"
      expected_query_count: 8
      goal_position_tolerance: 0.02
      goal_yaw_tolerance: 0.02
      start_position_tolerance: 0.50

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /model/jackal/odometry
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 60.0
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      # A stateful XY latch is incompatible with the no-reverse/no-pivot
      # contract: after latching position, a forward yaw correction can leave
      # the goal behind with no legal recovery. Require XY and yaw together.
      stateful: false
      # Stricter than the frozen acceptance gate (0.125 m / 5 deg).  The frozen
      # 48-bin L3 endpoint differs from cmp2-05's requested yaw by 0.064404 rad;
      # a 1 deg controller gate leaves 0.005409 rad for the independent audit.
      # The mission overwrites these two fields after every lifecycle reset
      # with the frozen per-query budget recorded in goal_checker_budgets.csv.
      xy_goal_tolerance: 0.110
      yaw_goal_tolerance: 0.017453292519943295
      trans_stopped_velocity: 0.02
      rot_stopped_velocity: 0.03
    FollowPath:
      plugin: "nav2_teb_controller::TEBController"
      log_level: "info"
      hcp:
        activate: false
      path_tracker:
        activate: true
      trajectory:
        reinit_dist: 2.0
        reinit_angle: 3.141592653589793
        reinit_path_dist: 0.35
        auto_resize: true
        dt_ref: 0.30
        dt_hyst: 0.05
        min_samples: 3
        max_samples: 50
        min_seg_length: 0.025
        max_seg_length: 0.30
        max_angle_diff: 0.15
        overwrite_plan_orientation: false
        allow_init_backward: false
        # Three poses suppress steering chatter on the dense band. The
        # forward-only fallback searches later poses if this chord projects behind.
        control_look_ahead_poses: 3
        max_global_plan_lookahead_dist: 5.0
        global_plan_prune_distance: 0.25
        control_min_look_ahead_time: 0.0
        min_prune_distance: 0.025
        # The no-reverse/no-pivot contract makes terminal overshoot unrecoverable
        # inside the tight frozen tolerance. Scale v/w together near the goal.
        # At 2.5 m/s preserve the validated 0.32/s terminal speed slope.
        # Its peak deceleration is 2.5 * 0.32 = 0.8 m/s^2.
        terminal_slowdown_distance: 7.8125
        terminal_min_speed: 0.02
        terminal_forward_extension: 0.20
        terminal_time_weight_scale: 0.001
        # Conservative cornering envelope for the simulated skid-steer plant;
        # straight segments retain the 2.5 m/s cruise ceiling.
        max_lateral_acceleration: 0.20
      robot:
        footprint:
          use_local_costmap: false
          model: "circles"
          # Conservative cover of the padded project rectangle (±0.265 x ±0.225 m).
          points: "[[-0.1325, 0.0, 0.263], [0.1325, 0.0, 0.263]]"
        # Jackal remains a skid-steer simulated plant.  The local optimizer uses
        # its Ackermann edge solely as the research kinematic contract because
        # this TEB implementation intentionally ignores R_min in skid_steer mode.
        robot_model: "ackermann"
        wheelbase: 0.50
        v_max_x: 2.50
        v_max_x_backwards: 0.0
        v_max_y: 0.0
        v_max_theta: 1.50
        a_max_x: 2.50
        a_max_y: 0.0
        a_max_theta: 2.0
        jerk_max_x: 3.0
        jerk_max_y: 0.0
        jerk_max_theta: 4.0
        # Ignored by skid-steer TEB internals; enforced by L3 plus downstream guard.
        min_turning_radius: 0.40
        steering_rate_max: 2.0
        has_steering: false
        use_proportional_saturation: true
      optimizer:
        solver: "eigen"
        algorithm: "levenberg_marquardt"
        activate: true
        fast_mode: true
        no_inner_iterations: 8
        no_outer_iterations: 4
        penalty_epsilon: 0.05
        fix_goal: true
        free_goal_vel: false
        verbose: false
        stepwise_optimization: false
        early_exit_min_delta: 0.001
      weights:
        # Make the time objective strong enough to sustain 2.5 m/s cruise with
        # the short optimization budget and the frozen kinematic constraints.
        weight_time_optimal: 1000.0
        # Dense high-speed sampling makes high-order finite differences unstable
        # across pruning. Keep velocity/acceleration costs and the hard guard;
        # disable these additional comfort objectives for this simulation profile.
        weight_jerk_max_x: 0.0
        weight_jerk_max_theta: 0.0
        weight_snap_max_x: 0.0
        weight_snap_max_theta: 0.0
        weight_shortest_path: 2.0
        weight_path_smoothness: 4.0
        weight_viapoint: 1000.0
        # The forward extension is an optimization aid, not permission to cut
        # past the original L3 endpoint.  Anchor one interior band pose to that
        # endpoint while it is inside the controller window.
        weight_terminal_waypoint: 1000000.0
        weight_v_max_x: 20.0
        weight_v_max_theta: 15.0
        weight_a_max_x: 40.0
        weight_a_max_theta: 50.0
        # Keep optimized pose headings tangent to the position band; otherwise
        # velocity extraction can command straight motion for a laterally bent path.
        weight_kinematics_nh: 100000.0
        # These are safety-contract constraints, not path-shape preferences.
        # Keep the optimizer several orders above time/path objectives; the
        # downstream guard remains the final hard enforcement layer.
        weight_kinematics_forward_drive: 1000000.0
        weight_kinematics_turning_radius: 1000000.0
        weight_max_steering_rate: 100.0
        weight_zero_steering_angle_goal: 20.0
        weight_start_steering_angle: 20.0
        weight_g3_continuity: 25.0
        weight_obstacle: 80.0
        weight_inflation: 8.0
      obstacles:
        include_dynamic_obstacles: false
        feasibility_check: 5.0
        min_obstacle_cost: 250
        inflation_dist: 0.60
        min_obstacle_dist: 0.20
        cutoff_dist: 0.20
        costmap_converter_plugin: ""
        costmap_converter_rate: 10.0
        costmap_converter_spin_thread: false
      visualization:
        activate: true
        publish_rate: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: jackal/odom
      robot_base_frame: jackal/base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      # Match the global costmap and the independent swept-footprint audit:
      # unknown frozen-map cells are collision space, never free local space.
      track_unknown_space: true
      footprint: "[[0.255,0.215],[0.255,-0.215],[-0.255,-0.215],[-0.255,0.215]]"
      footprint_padding: 0.010
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.08
          raytrace_max_range: 10.0
          raytrace_min_range: 0.08
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: jackal/base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.255,0.215],[0.255,-0.215],[-0.255,-0.215],[-0.255,0.215]]"
      footprint_padding: 0.010
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.08
          raytrace_max_range: 10.0
          raytrace_min_range: 0.08
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: jackal/odom
    robot_base_frame: jackal/base_link
    transform_tolerance: 0.2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: jackal/base_link
    odom_topic: /model/jackal/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 2000
    default_nav_to_pose_bt_xml: ""
    # This repository's bt_navigator configures both navigators unconditionally.
    # The through-poses action is unused, but must parse a recovery-free tree at activation.
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    # The simulated wheel command follows the output closely. A second
    # filtered feedback loop delays braking below the TEB acceleration model.
    feedback: "OPEN_LOOP"
    # Keep a 0.1 mm/s command margin below the strict measured 2.5 m/s gate
    # so Gazebo floating-point integration cannot trip it during cruise.
    max_velocity: [2.4999, 0.0, 1.50]
    min_velocity: [0.0, 0.0, -1.50]
    # Execution margin for sampled Gazebo dynamics; the audited contract
    # remains +/-2.5 m/s^2 and +/-2.0 rad/s^2.
    max_accel: [2.00, 0.0, 1.60]
    max_decel: [-2.00, 0.0, -1.60]
    odom_topic: /model/jackal/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server", "smoother_server", "planner_server", "behavior_server", "bt_navigator", "waypoint_follower", "velocity_smoother"]

lifecycle_manager_map:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: ["map_server"]
