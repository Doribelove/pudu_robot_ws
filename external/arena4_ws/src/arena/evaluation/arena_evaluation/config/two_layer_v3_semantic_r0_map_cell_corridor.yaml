semantic_applicability:
  raw_semantic_target_unchanged: true
  require_same_semantic_feature_instance: true
  require_complete_padded_footprint: true
  require_static_start_reachable_and_goal_coreachable: true
  require_target_on_or_before_directed_goal_plane: true
  require_replayable_forward_only_se2_chain: true
  absent_intersection_status: NOT_APPLICABLE
  absent_intersection_counts_as_success: false
  retain_original_query_as_negative_regression: true
  yaw_bins: 48
  motion_model: DUBIN
  allow_reverse: false
  allow_in_place_rotation: false
  minimum_turning_radius_m: 0.40
  maximum_curvature_1pm: 2.50
  padded_footprint: [[0.265, 0.225], [0.265, -0.225], [-0.265, -0.225], [-0.265, 0.225]]
  numeric_goal_plane_tolerance_m: 0.05

mirror_selection:
  minimum_endpoint_clearance_m: 1.50
  minimum_euclidean_separation_m: 8.0
  maximum_euclidean_separation_m: 20.0
  maximum_l1_endpoint_attachment_distance_m: 2.0
  require_same_lane_instance: true
  require_same_undirected_l1_route: true
  selection_order:
    - descending minimum endpoint clearance
    - descending endpoint Euclidean separation
    - ascending lane semantic ID
    - ascending endpoint coordinate tuple
    - ascending source candidate ID
  selection_rule: first pair in frozen order ranking with independent bidirectional applicability certificates
  no_reselection_after_freeze: true

ordered_se2_certificate:
  station_spacing_m: 0.50
  lateral_sample_spacing_m: 0.25
  maximum_lateral_probe_m: 6.0
  maximum_cells_per_station: 9
  yaw_neighbor_bins: [-1, 0, 1]
  maximum_station_skip: 4
  maximum_local_edge_length_m: 3.0
  maximum_local_edge_ratio: 1.75
  maximum_labels_per_node: 8
  maximum_graph_edges: 250000
  turning_radius_m: 0.401
  endpoint_attachment_limit_m: 2.0
  projection_epsilon_m: 0.000001
  candidate_cell_source: map_cells_in_local_station_slab
  station_slab_half_width_m: 0.30
  target_candidate_order: maximum_static_clearance_then_minimum_target_error

r2_semantic_acceptance:
  short_path_max_m: 12.0
  long_path_endpoint_exclusion_each_m: 6.0
  lane_correct_side_ratio_min: 0.80
  lane_target_band_ratio_min_exclusive: 0.50
  lane_lateral_error_p50_max_m: 0.50
  parking_normalized_deviation_p50_max: 0.25
  parking_center_band_ratio_min_exclusive: 0.50

stage_gates:
  stage1_new_mirror: both directions applicable and query set frozen before path acceptance
  stage2_offline_triad: new mirror positive, new mirror negative and frozen long south all strict pass
  stage3_online_targeted: only after stage2 3/3
  stage4_selected8: only after online targeted, exact ACK and cold latency gates
  exact_effective_content_ack_mismatch_max: 0
  cold_request_candidate_over_e0_p50_hard_max: 2.0
  cold_request_candidate_over_e0_p50_target: 1.5

grading:
  B: offline and online targeted pass, fair three-arm comparison, exact ACK, cold latency, selected8 repeated measurements and all safety gates
  any_required_gate_missing_or_failed: C
